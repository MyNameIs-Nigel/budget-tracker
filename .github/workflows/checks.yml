name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
          POSTGRES_DB: budget_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget -d budget_e2e_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://budget:budget@127.0.0.1:5432/budget_e2e_test
      MIGRATION_TEST_DATABASE_URL: postgresql://budget:budget@127.0.0.1:5432/budget_migration_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: docker exec ${{ job.services.postgres.id }} createdb -U budget budget_migration_test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-artifacts
          path: test-results/
          retention-days: 7
